# ==========================================
# DEVELOPMENT PROFILE CONFIGURATION (DEV - LOCAL POSTGRESQL)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-delicate-moon-a1jfnlax-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_N1lq4SYCHGov}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.project: DEBUG
    org.springframework.web: INFO
