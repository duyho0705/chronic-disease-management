spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:classpath:application-secret.yml
  application:
    name: backend
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-delicate-moon-a1jfnlax-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:npg_N1lq4SYCHGov}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      # Shorter max-lifetime and keepalive-time for Neon Serverless DB
      max-lifetime: 600000 
      connection-timeout: 30000
      keepalive-time: 30000
      leak-detection-threshold: 15000
      # Modern validation
      validation-timeout: 5000
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  # Secret must be at least 256 bits (32 chars length)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in ms
  refresh-expiration: 604800000 # 7 days in ms

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

# AI Health Assistant (Groq - Llama)
ai:
  groq:
    api-key: ${GROQ_API_KEY:your_groq_api_key}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}

# Zalo Official Account Integration
zalo:
  oa:
    app-id: ${ZALO_APP_ID:your_app_id}
    app-secret: ${ZALO_APP_SECRET:your_app_secret}
    access-token: ${ZALO_ACCESS_TOKEN:your_access_token}
    refresh-token: ${ZALO_REFRESH_TOKEN:your_refresh_token}

# Cloudinary for Image Uploads
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
