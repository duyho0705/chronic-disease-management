name: CI/CD Pipeline & Automated Testing

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests

  e2e-testing:
    name: Playwright Automated E2E Tests
    runs-on: ubuntu-latest
    needs: build-backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Build Backend JAR
      run: cd backend && mvn clean package -DskipTests

    - name: Start Spring Boot Backend in Background
      env:
        SPRING_SQL_INIT_MODE: always
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        DB_URL: jdbc:postgresql://localhost:5432/neondb
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
      run: |
        cd backend
        nohup java -jar target/*.jar > spring.log 2>&1 &
        echo "Waiting for Spring Boot Backend on port 8080..."
        SUCCESS=0
        for i in {1..60}; do
          if curl -s -m 2 http://localhost:8080/api/v1/system-config > /dev/null 2>&1; then
            echo "Spring Boot Backend is UP & RUNNING!"
            SUCCESS=1
            break
          fi
          echo "Waiting for backend startup... ($i/60)"
          sleep 2
        done
        if [ $SUCCESS -eq 0 ]; then
          echo "=== ERROR: Spring Boot Backend failed to start. Log output ==="
          cat spring.log
          exit 1
        fi

    - name: Install Frontend Dependencies
      run: cd frontend && npm ci

    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium

    - name: Build Frontend
      run: cd frontend && npm run build

    - name: Run Playwright E2E Tests
      run: cd frontend && npx playwright test

    - name: Upload Spring Log & Playwright Report on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-artifacts
        path: |
          backend/spring.log
          frontend/playwright-report/
        retention-days: 7
