name: CI/CD Pipeline & Automated Testing

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests

  e2e-testing:
    name: Playwright Automated E2E Tests
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Build Backend JAR
      run: cd backend && mvn clean package -DskipTests

    - name: Start Spring Boot Backend in Background
      run: |
        cd backend
        nohup java -jar target/*.jar > spring.log 2>&1 &
        echo "Waiting for Spring Boot Backend on port 8080..."
        timeout 60 bash -c 'until curl -s http://localhost:8080/api/v1/system-config; do sleep 2; done' || true
        echo "Backend server status check completed."

    - name: Install Frontend Dependencies
      run: cd frontend && npm ci

    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium

    - name: Build Frontend
      run: cd frontend && npm run build

    - name: Run Playwright E2E Tests
      run: cd frontend && npx playwright test

    - name: Upload Playwright Test Report on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
